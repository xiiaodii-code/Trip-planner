<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1D1C1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;700&display=swap" media="print" onload="this.media='all'">
<style id="lf-css">/*LEAFLET_CSS*/</style>
<style id="tp-css">
:root{--bg:#EDE6D8;--paper:#FBF8F1;--ink:#1D1C1A;--mute:#6B665E;--red:#B5432F;--red-d:#8E2F20;--gold:#D7A13B;--navy:#2C3E5C;--green:#3E7C5A;--tagbg:#F5E8CC;--tagfg:#8A6322;--line:#DDD4C3;--bw:2.5px;
--serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
button{-webkit-tap-highlight-color:transparent}
a{color:inherit}
.tp{max-width:720px;margin:0 auto;min-height:100vh;background:var(--paper);padding-bottom:120px}
.hero{padding:28px 20px 22px;border-bottom:4px solid var(--ink);background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(0,0,0,.03) 14px 15px),var(--paper)}
.kicker{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;color:var(--red);letter-spacing:.14em;font-size:15px;flex-wrap:wrap}
.badge{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--red);color:#fff;border-radius:6px;font-size:16px;letter-spacing:0;flex:none}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(30px,8.5vw,42px);line-height:1.25;margin:12px 0 8px}
.hero h1 em{font-style:normal;color:var(--red)}
.sub{color:var(--mute);margin:0 0 16px;line-height:1.6;font-size:15px}
.basebox{background:var(--ink);color:#fff;border-radius:14px;padding:14px 18px;line-height:1.65;font-size:15px}
.basebox b{color:var(--gold)}
.basebox a{color:#fff}
.tabs{position:sticky;top:0;z-index:500;display:flex;gap:10px;overflow-x:auto;padding:14px 16px 16px;background:rgba(251,248,241,.96);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;width:78px;height:82px;border:var(--bw) solid var(--ink);border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font:inherit;color:var(--ink);transform:rotate(-1.2deg);padding:0}
.tab:nth-child(even){transform:rotate(1.2deg)}
.tab .cn{font-family:var(--serif);font-weight:900;font-size:24px;line-height:1.2}
.tab small{font-size:12px;letter-spacing:.04em}
.tab.on{background:var(--red);color:#fff;border-color:var(--red-d);box-shadow:0 4px 0 var(--red-d)}
.tab.ghost{border-style:dashed;background:transparent}
.tab.ghost.on{background:var(--red);border-style:solid}
.edithint{background:var(--gold);color:var(--ink);text-align:center;font-size:13px;font-weight:700;padding:7px}
.day,.pack,.ov,.notes{padding:24px 18px}
.sec-h{font-family:var(--serif);font-weight:900;font-size:28px;margin:0 0 6px;line-height:1.3}
.daysub{color:var(--mute);margin:0 0 12px;font-size:15px;line-height:1.5}
.daysum{margin:0 0 16px;line-height:1.75;font-size:15px;border-left:4px solid var(--gold);padding:2px 0 2px 12px}
.empty{color:var(--mute);text-align:center;padding:30px 0}
/* map */
.mapwrap{position:relative;margin:0 0 16px;border:var(--bw) solid var(--ink);border-radius:18px;overflow:hidden;background:#E8E4DA;z-index:1}
.map{height:250px;transition:height .25s}
.mapwrap.big .map{height:62vh}
.mapbtn{position:absolute;right:10px;top:10px;z-index:900;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.mapnote{position:absolute;left:10px;bottom:8px;z-index:900;background:rgba(255,255,255,.9);border-radius:8px;padding:3px 8px;font-size:11.5px;color:var(--mute)}
.tilefail{position:absolute;left:10px;right:10px;bottom:28px;z-index:900;background:rgba(29,28,26,.88);color:#fff;font-size:12.5px;line-height:1.5;border-radius:10px;padding:8px 10px;pointer-events:none}
.pin{background:none;border:none}
.pin span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:900;font-size:14px;border:2.5px solid var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.25);font-family:var(--sans)}
.pin.sm span{width:22px;height:22px;font-size:11px;border-width:2px}
.pin.home span{background:var(--ink)!important;color:var(--gold);font-size:15px}
.pin.dim{opacity:.25}
.leaflet-container{font-family:var(--sans)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;background:#fff;cursor:pointer;color:var(--ink)}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.chip.on{background:var(--ink);color:#fff}
.ovday{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;width:100%;font:inherit;text-align:left;color:var(--ink)}
.ovday .dn{font-family:var(--serif);font-weight:900;font-size:22px;width:36px;height:36px;border-radius:10px;color:#fff;display:grid;place-items:center;flex:none}
.ovday b{display:block;font-size:16px}
.ovday small{color:var(--mute);font-size:13px}
/* timeline */
.sum{display:grid;grid-template-columns:1fr 1fr;background:#EFE7D4;border:var(--bw) solid var(--ink);border-radius:16px;padding:14px 0;margin-bottom:10px;text-align:center}
.sum>div+div{border-left:1px solid #CFC3A8}
.sum small{display:block;color:var(--mute);font-size:13px;margin-bottom:4px}
.sum b{font-family:var(--serif);font-size:24px;color:var(--navy)}
.sum b.red{color:var(--red)}
.leg{display:flex;align-items:center;gap:10px;padding:10px 4px;color:var(--mute);font-size:14px}
.legic{width:28px;height:28px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:15px;flex:none}
.legic.m-walk{background:#A7A196}.legic.m-metro,.legic.m-bus{background:#8FB3A0}
.legtxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legnum{min-width:48px;text-align:right;border-bottom:1.5px dashed #CFC3A8;padding-bottom:2px;white-space:nowrap;font-size:13px}
.legnum b{color:var(--ink);font-size:16px;margin-right:3px}
.card{position:relative;background:#fff;border:var(--bw) solid var(--ink);border-radius:18px;overflow:hidden;margin:8px 0;scroll-margin-top:130px}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:5px;background:var(--c,var(--gold));border-radius:0 4px 4px 0}
.card.flash{animation:flash 1.2s}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
.cardhead{display:flex;align-items:center;gap:10px;padding:14px 14px 14px 20px;cursor:pointer}
.num{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center;border:2px solid var(--ink);flex:none}
.time{font-family:var(--serif);font-weight:900;font-size:20px;background:#F2ECDD;border:var(--bw) solid var(--ink);border-radius:10px;padding:2px 9px;flex:none;line-height:1.3}
.ht{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.tag{font-size:12px;background:var(--tagbg);color:var(--tagfg);padding:3px 9px;border-radius:999px;font-weight:700;white-space:nowrap}
.ht h3{margin:0;font-size:17px;font-weight:700;line-height:1.4;word-break:break-word}
.chev{color:#999;font-size:13px;transition:transform .2s;flex:none}
.card.open .chev{transform:rotate(90deg)}
.cardbody{display:none;margin:0 16px 0 20px;padding:14px 0 16px;border-top:1.5px dashed var(--line)}
.card.open .cardbody{display:block}
.subline{margin:0 0 10px;color:var(--navy);font-size:14px;line-height:1.6;font-weight:700}
.lbl{color:var(--green);font-weight:700;font-size:14px;margin-bottom:6px}
.note{margin:0;line-height:1.75;font-size:15.5px;white-space:pre-wrap;word-break:break-word}
.note a,.subline a,.nbody a,.basebox a{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;font-size:14px;text-decoration:none;border:1.5px solid;max-width:100%;cursor:pointer;font-family:inherit}
.pill.amap{background:#E8F3EE;color:#2D6A4F;border-color:#B7D6C6}
.pill.onmap{background:#F3ECDC;color:var(--navy);border-color:#DDCFAF}
.editbar{display:flex;gap:8px;padding:0 14px 12px 20px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;border:2px solid var(--ink);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;color:var(--ink);text-decoration:none;text-align:center}
.btn:disabled{opacity:.35}
.btn.pri{background:var(--ink);color:#fff}
.btn.red{color:var(--red);border-color:var(--red)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px}
.addbtn{width:100%;margin-top:14px;border:2px dashed var(--ink);background:transparent;border-radius:16px;padding:16px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
.dayctl{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
/* notes */
.ncard{background:#fff;border:var(--bw) solid var(--ink);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.ncard h3{font-family:var(--serif);font-size:20px;margin:0 0 10px}
.nbody{margin:0;white-space:pre-wrap;line-height:1.75;font-size:15px;word-break:break-word}
/* packing */
.prog{height:12px;background:#E9E1CF;border-radius:99px;overflow:hidden;border:2px solid var(--ink);margin-bottom:8px}
.prog i{display:block;height:100%;background:var(--red);transition:width .3s}
.pgroup h4{font-family:var(--serif);margin:20px 0 8px;font-size:17px}
.chk{display:flex;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:12px;margin-bottom:8px}
.chk label{flex:1;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--red);flex:none;margin:0}
.chk.done span{text-decoration:line-through;color:#9a948a}
.chk .x{border:none;background:none;font-size:20px;color:#999;cursor:pointer;padding:8px 14px}
.addpack{display:grid;grid-template-columns:1fr 96px auto;gap:8px;margin-top:18px}
.addpack input{font:inherit;font-size:16px;padding:10px 12px;border:2px solid #CFC6B4;border-radius:10px;min-width:0;background:#fff}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.actions .grow{flex:1}
.foot{text-align:center;color:var(--mute);font-size:12px;padding:20px 0 0}
</style>
<style>
/* editor-only */
.topbar{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--ink);color:#fff;font-size:14px}
.topbar button{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.45);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;flex:none}
.topbar .tt{flex:1;min-width:0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.75}
.fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:calc(24px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:var(--ink);color:#fff;border:none;font-size:24px;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:1000;cursor:pointer}
.fab.on{background:var(--red)}
.sheet-bg{position:fixed;inset:0;background:rgba(20,18,15,.45);z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));border-top:var(--bw) solid var(--ink)}
.sheet h3{font-family:var(--serif);font-size:22px;margin:0 0 14px;line-height:1.4}
.f{display:block;margin-bottom:12px;min-width:0}
.f>span{display:block;font-size:13px;color:var(--mute);margin-bottom:5px;font-weight:700}
.f input,.f textarea,.f select,.pick input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:2px solid #CFC6B4;border-radius:10px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none;min-height:46px}
.f textarea{min-height:120px;resize:vertical;line-height:1.6}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--ink)}
.hint{display:block;font-style:normal;font-size:12.5px;color:var(--mute);margin-top:5px;line-height:1.55}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row.r3{grid-template-columns:1.4fr 1fr 1fr}
.fsec{font-weight:900;margin:20px 0 10px;padding-top:14px;border-top:1.5px dashed var(--line)}
.pick{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px}
.pickmap{height:230px;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.presults{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.presults button{text-align:left;font:inherit;font-size:13px;border:1.5px solid #CFC6B4;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}
.trow{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:14px;margin-bottom:10px}
.trow.on{border-color:var(--red);box-shadow:0 3px 0 var(--red)}
.trow b{font-family:var(--serif);font-size:17px}
.trow .meta{color:var(--mute);font-size:13px;margin:4px 0 10px}
.trow .btns{display:flex;gap:8px;flex-wrap:wrap}
.exbox{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:14px;font-size:13px;color:var(--mute);line-height:1.6}
.exbox b{display:block;color:var(--ink);font-size:15px;word-break:break-all;margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:3000;font-size:14px;max-width:90vw;text-align:center}
code{background:#EFE7D4;padding:1px 6px;border-radius:5px;font-size:.92em}
</style>
</head>
<body>
<div class="topbar"><button id="btnTrips">☰ 我的行程</button><span class="tt" id="tt"></span><button id="btnExport">⤓ 导出</button></div>
<div id="app"></div>
<button class="fab" id="fab" aria-label="编辑">✎</button>
<datalist id="tagList"><option value="景点"><option value="美食"><option value="早茶"><option value="购物"><option value="交通"><option value="住宿"><option value="航班"><option value="夜场"><option value="咖啡"></datalist>

<script id="lf-js">/*LEAFLET_JS*/</script>
<script id="tp-viewer">
/* ===== Viewer: shared by the editor and the exported static page ===== */
var TP = (function () {
  var NUM = '壹贰叁肆伍陆柒捌玖';
  var WK = '日一二三四五六';
  var MODES = { taxi: ['🚕', '打车'], metro: ['🚇', '地铁'], bus: ['🚌', '公交'], walk: ['🚶', '步行'], train: ['🚄', '高铁／火车'], ferry: ['⛴️', '船'], flight: ['✈️', '飞机'], other: ['➜', '其他'] };
  var PAL = ['#D7A13B', '#3E7C5A', '#B5432F', '#2C5D8A', '#7A4E8C', '#C2703A'];
  var DAYCOL = ['#2E9E6B', '#D9822B', '#2C6BB5', '#C2413A', '#8A55B5', '#B8962E', '#1F9AA3', '#C2557A', '#5A7A2E', '#6B5B4B'];
  var TILE = 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}';

  function cn(n) { if (n < 10) return NUM[n - 1]; var t = Math.floor(n / 10), u = n % 10; return (t > 1 ? NUM[t - 1] : '') + '拾' + (u ? NUM[u - 1] : ''); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function linkify(s) {
    return esc(s).replace(/(\+86[-\s]?)?(0\d{2,3}-\d{7,8}|1\d{2}-\d{4}-\d{4}|400-\d{3}-\d{4}|\d{2}-\d{8})(?!\d)/g, function (m) { return '<a href="tel:' + m.replace(/[^\d+]/g, '') + '">' + m + '</a>'; });
  }
  function pd(n) { return (n < 10 ? '0' : '') + n; }
  function dayDate(start, i) { if (!start) return null; var p = start.split('-'); if (p.length < 3) return null; return new Date(+p[0], p[1] - 1, +p[2] + i); }
  function md(d) { return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日'; }
  function range(t) {
    var n = (t.days || []).length, a = dayDate(t.start, 0), b = dayDate(t.start, Math.max(0, n - 1));
    if (!a) return '';
    var s = a.getFullYear() + '.' + pd(a.getMonth() + 1) + '.' + pd(a.getDate());
    if (n > 1) s += ' – ' + (b.getFullYear() !== a.getFullYear() ? b.getFullYear() + '.' : '') + pd(b.getMonth() + 1) + '.' + pd(b.getDate());
    return s;
  }
  function color(tag) { if (!tag) return PAL[0]; var h = 0; for (var i = 0; i < tag.length; i++) h = (h * 31 + tag.charCodeAt(i)) >>> 0; return PAL[h % PAL.length]; }
  function dcol(i) { return DAYCOL[i % DAYCOL.length]; }
  function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
  function has(v) { return v !== '' && v != null; }
  function fmtN(n) { return Math.round(n * 100) / 100; }
  function hm(min) { min = Math.round(min); var h = Math.floor(min / 60), m = min % 60; if (!h) return m + ' 分'; return h + ' 时' + (m ? ' ' + m + ' 分' : ''); }
  function pt(c) { var m = /^\s*(-?\d+(?:\.\d+)?)\s*[,，]\s*(-?\d+(?:\.\d+)?)\s*$/.exec(c || ''); return m ? [+m[2], +m[1]] : null; } // -> [lat,lng]
  function amap(kw, city) { return 'https://uri.amap.com/search?keyword=' + encodeURIComponent(kw) + (city ? '&city=' + encodeURIComponent(city) : '') + '&src=trip-planner&callnative=1'; }
  function hasMap() { return typeof L !== 'undefined'; }
  function numbering(d) { var n = 0, out = {}; (d.items || []).forEach(function (it) { if (pt(it.coord)) out[it.id] = ++n; }); return out; }

  function hero(t, ed) {
    var kick = t.kicker ? esc(t.kicker) : [(t.days || []).length + ' DAYS'].concat(t.tags || []).map(esc).join(' · ');
    var title = esc(t.title || '未命名旅程');
    if (t.accent && (t.title || '').indexOf(t.accent) > -1) { var a = esc(t.accent); title = title.replace(a, function () { return '<em>' + a + '</em>'; }); }
    return '<header class="hero"><div class="kicker">' + (t.badge ? '<span class="badge">' + esc(t.badge) + '</span>' : '') + '<span>' + kick + '</span></div>' +
      '<h1>' + title + '</h1><p class="sub">' + esc(range(t)) + (t.subtitle ? '　' + esc(t.subtitle) : '') + '</p>' +
      (t.base ? '<div class="basebox">🏨 <b>住宿：</b>' + linkify(t.base) + '</div>' : '') +
      (ed ? '<div class="actions" style="margin-top:14px"><button class="btn sm" data-act="editTrip">✎ 编辑旅程资料</button></div>' : '') + '</header>';
  }

  function tabs(t, st, ed) {
    var h = '<nav class="tabs"><button class="tab ghost' + (st.tab === 'map' ? ' on' : '') + '" data-tab="map"><span class="cn">🗺️</span><small>总览</small></button>';
    (t.days || []).forEach(function (d, i) { h += '<button class="tab' + (st.tab === i ? ' on' : '') + '" data-tab="' + i + '"><span class="cn">' + cn(i + 1) + '</span><small>DAY ' + (i + 1) + '</small></button>'; });
    if (ed) h += '<button class="tab ghost" data-act="addDay"><span class="cn">＋</span><small>加一天</small></button>';

  /* ---------- maps ---------- */
  function newMap(root, id, key) {

    var loaded = false, tl = L.tileLayer(TILE, { subdomains: '1234', maxZoom: 18, attribution: '© 高德地图' }).addTo(m);

  function pin(label, col, cls) { return L.divIcon({ className: 'pin ' + (cls || ''), html: '<span style="background:' + col + '">' + label + '</span>', iconSize: cls === 'sm' ? [22, 22] : [30, 30], iconAnchor: cls === 'sm' ? [11, 11] : [15, 15] }); }
  function homeMarker(t, m) { var p = pt(t.baseCoord); if (p) L.marker(p, { icon: pin('★', '#1D1C1A', 'home'), zIndexOffset: -100 }).addTo(m).bindTooltip(t.baseName || '住宿'); }

  function initMaps(root) {
    var c = root._tp, t = c.trip, st = c.st, ed = c.opts.mode === 'edit' && c.opts.editing;
    c.maps.forEach(function (m) { m.remove(); }); c.maps = []; c.mapById = {}; c.markers = {};
    if (!hasMap()) return;
    if (typeof st.tab === 'number' && t.days[st.tab]) {
      var di = st.tab, d = t.days[di], nums = numbering(d), key = 'd' + d.id, m = newMap(root, 'dmap', key);
      if (!m) return;
      var pts = [], fp = [], col = dcol(di);
      homeMarker(t, m);
      d.items.forEach(function (it) {
        var p = pt(it.coord); if (!p) return; pts.push(p); if (it.tag !== '航班') fp.push(p);
        var mk = L.marker(p, { icon: pin(nums[it.id], col), draggable: ed }).addTo(m).bindTooltip(nums[it.id] + '. ' + it.name, { direction: 'top', offset: [0, -14] });

        d.items.forEach(function (it) {
          var p = pt(it.coord); if (!p) return; ps.push(p); if (!dim) { all.push(p); if (it.tag !== '航班') fa.push(p); }
          L.marker(p, { icon: pin(i + 1, col, 'sm' + (dim ? ' dim' : '')), zIndexOffset: dim ? -500 : 0 }).addTo(om)
            .bindTooltip('D' + (i + 1) + ' · ' + it.name, { direction: 'top', offset: [0, -10] })
            .on('click', function () { st.tab = i; st.open[it.id] = true; draw(root); setTimeout(function () { focusCard(root, it.id, true); }, 50); });
        });
        if (ps.length > 1) L.polyline(ps, { color: col, weight: dim ? 2 : 4, opacity: dim ? .2 : .85 }).addTo(om);
      });

  }
  function focusCard(root, id, noScrollMap) {

  function draw(root) {

    var body = st.tab === 'pack' ? pack(t, c) : st.tab === 'notes' ? notesView(t, ed) : st.tab === 'map' ? overview(t, st) : day(t, st.tab, st, ed);
    var h = '<div class="tp">' + (ed ? '<div class="edithint">编辑模式 · 改完按右下角 ✓</div>' : '') + hero(t, ed) + tabs(t, st, ed) + '<main>' + body + '</main>';

  function goTab(root, v) {
    var c = root._tp; c.st.tab = (v === 'pack' || v === 'notes' || v === 'map') ? v : +v; draw(root);
    var nav = root.querySelector('.tabs'), on = nav && nav.querySelector('.tab.on'), m = root.querySelector('main');

  function savePack(c) { try { localStorage.setItem(viewPackKey(c.trip), JSON.stringify(Object.keys(c.vp))); } catch (e) {} }
  function onChange(root, e) {

})();

  function coordPicker(s, input, center, query) {
    if (typeof L === 'undefined') return;
    var box = s.querySelector('.pickmap'), m = L.map(box, { scrollWheelZoom: false }), mk = null;
    L.tileLayer(TP.TILE, { subdomains: '1234', maxZoom: 18, attribution: '© 高德地图' }).addTo(m);
    sheetMaps.push(m);
    function set(p, pan) {
      input.value = p[1].toFixed(5) + ',' + p[0].toFixed(5);
      if (!mk) { mk = L.marker(p, { draggable: true, icon: L.divIcon({ className: 'pin', html: '<span style="background:#B5432F">●</span>', iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(m); mk.on('dragend', function () { var ll = mk.getLatLng(); set([ll.lat, ll.lng]); }); }
      else mk.setLatLng(p);
      if (pan) m.setView(p, Math.max(m.getZoom(), 16));
    }
    var p0 = TP.pt(input.value);
    if (p0) { m.setView(p0, 16); set(p0); } else m.setView(center || [23.13, 113.26], center ? 14 : 12);
    setTimeout(function () { m.invalidateSize(); }, 200);
    m.on('click', function (e) { set([e.latlng.lat, e.latlng.lng]); });
    input.addEventListener('change', function () { var p = TP.pt(input.value); if (p) set(p, true); });
    var q = s.querySelector('.psearch'), res = s.querySelector('.presults');
    if (query && !p0) q.value = query;
    function search() {
      var term = q.value.trim(); if (!term) return; res.innerHTML = '<em class="hint">搜索中…</em>';
      fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=zh-CN&q=' + encodeURIComponent(term)).then(function (r) { return r.json(); }).then(function (list) {
        if (!list.length) { res.innerHTML = '<em class="hint">找不到，换个关键词，或直接在地图上点。</em>'; return; }
        res.innerHTML = list.map(function (x, i) { return '<button type="button" data-i="' + i + '">' + esc(x.display_name) + '</button>'; }).join('');
        res.onclick = function (e) { var b = e.target.closest('[data-i]'); if (!b) return; var x = list[+b.dataset.i], g = wgs2gcj(+x.lon, +x.lat); set([g[1], g[0]], true); res.innerHTML = ''; };
      }).catch(function () { res.innerHTML = '<em class="hint">搜索失败（可能没网络），直接在地图上点。</em>'; });
    }
    s.querySelector('[data-x=psearch]').onclick = search;
    q.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); search(); } });
    s.querySelector('[data-x=pclear]').onclick = function () { input.value = ''; if (mk) { mk.remove(); mk = null; } };
  }

      }
      else if (a === 'del') ask('删除行程「' + src.title + '」？此操作无法恢复。').then(function (ok) {
        if (!ok) return tripsSheet();
        db.trips = db.trips.filter(function (t) { return t.id !== src.id; });
        if (db.activeId === src.id) { db.activeId = db.trips[0].id; resetView(); }
        save(); render(); tripsSheet();
      });
      else if (a === 'new') { var nt = blankTrip(); db.trips.push(nt); db.activeId = nt.id; resetView(); editing = true; commit(); tripForm(nt, true); }
      else if (a === 'import') s.querySelector('#impFile').click();
      else if (a === 'backup') download('trips-backup-' + today().replace(/-/g, '') + '.json', JSON.stringify(db, null, 2), 'application/json');
    });
    s.querySelector('#impFile').onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      f.text().then(function (txt) {
        var data = JSON.parse(txt), list = data.trips ? data.trips : (data.days ? [data] : []);
        if (!list.length) throw new Error('格式不对');
        list.forEach(function (t) { if (!t.id || db.trips.some(function (x) { return x.id === t.id; })) t.id = uid(); db.trips.push(norm(t)); });
        db.activeId = list[list.length - 1].id; resetView(); save(); render(); closeSheet(); toast('已导入 ' + list.length + ' 个行程');
      }).catch(function (err) { toast('导入失败：' + err.message); });
    };
  }

  /* ---------- Export ---------- */
  function txt(id) { return document.getElementById(id).textContent; }
  function buildExport(t) {
    var data = clone(t); data.packing.forEach(function (p) { delete p.done; });
    var json = JSON.stringify(data).replace(/</g, '\\u003c').split(String.fromCharCode(8232)).join('\\u2028').split(String.fromCharCode(8233)).join('\\u2029');
    return '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n<meta name="robots" content="noindex,nofollow">\n<meta name="theme-color" content="#1D1C1A">\n' +
      '<title>' + esc(t.title) + '</title>\n' + FONTS + '\n<style>' + txt('lf-css') + '</style>\n<style>' + txt('tp-css') + '</style>\n</head>\n<body>\n<div id="app"></div>\n' +
      '<script>' + txt('lf-js') + '<\/script>\n<script>' + txt('tp-viewer') + '<\/script>\n' +
      '<script>TP.mount(document.getElementById("app"),' + json + ',{mode:"view"});<\/script>\n</body>\n</html>\n';
  }
  function shareUrl(t) { var b = (db.baseUrl || '').trim().replace(/\/+$/, ''); return b ? b + '/t/' + slugOf(t) : ''; }
  function exportSheet() {
    var t = cur(), slug = slugOf(t), url = shareUrl(t);
    var s = openSheet('<h3>导出给同行的人</h3>' +
      '<p class="hint" style="margin-top:-6px">生成一个只读的静态网页（含地图、高德链接、备忘、行李清单，全部打包在一个文件里），放进 repo 的 <code>public/t/</code> 推上 GitHub，Cloudflare 会自动部署。</p>' +
      '<div class="exbox">文件名<b>' + esc(slug) + '.html</b>放到<b>public/t/' + esc(slug) + '.html</b>分享网址<b id="exUrl">' + (url ? esc(url) : '（先在下面填你的 Worker 网址）') + '</b></div>' +
      '<label class="f" style="margin-top:14px"><span>你的 Worker 网址（只需填一次）</span><input id="baseUrl" value="' + esc(db.baseUrl || '') + '" placeholder="https://trip-planner.xxx.workers.dev"></label>' +
      '<div class="stack"><button class="btn pri" data-a="dl">⤓ 下载 HTML</button><button class="btn" data-a="preview">👀 预览成品</button>' +
      '<button class="btn" data-a="copyhtml">复制 HTML 源码</button><button class="btn" data-a="copyurl">复制分享网址</button>' +
      '<button class="btn" data-a="json">备份这个行程（JSON）</button></div>' +
      (t.slug ? '' : '<p class="hint">提示：在「编辑旅程资料」设定网址代号，网址会比较好记。</p>'));
    s.querySelector('#baseUrl').addEventListener('input', function (e) {
      db.baseUrl = e.target.value.trim(); save(); var u = shareUrl(t); s.querySelector('#exUrl').textContent = u || '（先在下面填你的 Worker 网址）';
    });
    s.addEventListener('click', function (e) {
      var b = e.target.closest('[data-a]'); if (!b) return; var a = b.dataset.a;
      if (a === 'dl') download(slug + '.html', buildExport(t), 'text/html');
      else if (a === 'preview') { var w = window.open(URL.createObjectURL(new Blob([buildExport(t)], { type: 'text/html' })), '_blank'); if (!w) toast('浏览器挡了新标签页，改用下载'); }
      else if (a === 'copyhtml') copyText(buildExport(t));
      else if (a === 'copyurl') { var u = shareUrl(t); if (u) copyText(u); else toast('先填 Worker 网址'); }
      else if (a === 'json') download(slug + '.json', JSON.stringify(t, null, 2), 'application/json');
    });
  }

  document.getElementById('btnTrips').onclick = tripsSheet;
  document.getElementById('btnExport').onclick = exportSheet;
  fab.onclick = function () { editing = !editing; render(); toast(editing ? '编辑模式' : '已保存'); };
  window.__tp = { db: function () { return db; }, buildExport: function () { return buildExport(cur()); } };
  save(); render();
})();
</script>
</body>
</html>
